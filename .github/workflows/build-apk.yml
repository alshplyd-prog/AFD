name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @tailwindcss/oxide-linux-x64-gnu --no-save || true

      - name: Build Web Project
        run: npx vite build

      - name: Re-apply Android Project Configuration
        run: |
          # Keep our custom build configurations and manifests safe before syncing
          cp android/build.gradle /tmp/build.gradle.bak || true
          cp android/app/build.gradle /tmp/app.build.gradle.bak || true
          cp android/variables.gradle /tmp/variables.gradle.bak || true
          cp android/gradle.properties /tmp/gradle.properties.bak || true
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak || true
          cp android/capacitor-cordova-android-plugins/build.gradle /tmp/cordova.build.gradle.bak || true
          cp android/gradle/wrapper/gradle-wrapper.jar /tmp/gradle-wrapper.jar.bak || true
          cp android/gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak || true
          cp android/gradlew /tmp/gradlew.bak || true
          
          npx cap sync android
          
          cp /tmp/build.gradle.bak android/build.gradle || true
          cp /tmp/app.build.gradle.bak android/app/build.gradle || true
          cp /tmp/variables.gradle.bak android/variables.gradle || true
          cp /tmp/gradle.properties.bak android/gradle.properties || true
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml || true
          cp /tmp/cordova.build.gradle.bak android/capacitor-cordova-android-plugins/build.gradle || true
          cp /tmp/gradle-wrapper.jar.bak android/gradle/wrapper/gradle-wrapper.jar || true
          cp /tmp/gradle-wrapper.properties.bak android/gradle/wrapper/gradle-wrapper.properties || true
          cp /tmp/gradlew.bak android/gradlew || true

      - name: Ensure Valid Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1 --no-daemon
          chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --info --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlKarrar-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
